# A tag `vYYYY.MM.DD` (or `vYYYY.MM.DD-N`) publishes a release: the server image on GHCR
# (amd64 + arm64) and the signed Android APK as a release asset.
# Needs the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# and ANDROID_KEY_PASSWORD: always the same key, otherwise installed apps cannot update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vitalocal
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=VitaLocal
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # never publish a debug-signed build: it could not update over the released app
          [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] \
            || { echo "::error::Android signing secrets are missing"; exit 1; }
          dir="$RUNNER_TEMP/signing"
          mkdir -m 700 "$dir"
          echo "$KEYSTORE" | base64 -d > "$dir/android-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$dir/android-release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$dir/android-signing.properties"
          echo "VITALOCAL_SIGNING_DIR=$dir" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - id: apk
        name: Name and check the APK
        working-directory: android
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          apk="VitaLocal-$name-$code.apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -v '^WARNING'
          if "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q 'CN=Android Debug'; then
            echo "::error::APK is signed with the debug key"; exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"
          (cd dist && sha256sum "$apk" > "$apk.sha256")
          echo "name=$apk" >> "$GITHUB_OUTPUT"
      - run: rm -rf "$RUNNER_TEMP/signing"
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/dist/

  release:
    needs: [image, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Notes
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          APK: ${{ needs.apk.outputs.name }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          cat > notes.md <<EOF
          **Server image:** \`ghcr.io/$owner/vitalocal:${TAG#v}\` (also \`:latest\`), amd64 and arm64.
          Set \`VITALOCAL_IMAGE\` in \`.env\`, then \`docker compose pull && docker compose up -d\`;
          migrations run on start.

          **Android app:** \`$APK\`. Upload it on your server under Settings → Android app; installed
          apps update from there.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.apk
            dist/*.sha256
