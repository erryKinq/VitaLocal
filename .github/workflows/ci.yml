# Lint and server tests (including the database tests against TimescaleDB) on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.31.0-pg16
        env:
          POSTGRES_USER: vitalocal
          POSTGRES_PASSWORD: vitalocal
          POSTGRES_DB: vitalocal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitalocal -d vitalocal_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      VITALOCAL_TEST_DATABASE_URL: postgresql+psycopg://vitalocal:vitalocal@localhost:5432/vitalocal_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # publishes no major tag
        with:
          python-version: "3.12"  # as in the image
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
