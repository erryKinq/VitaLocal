[project]
name = "vitalocal"
version = "0.2.0"
description = "VitaLocal – self-hosted health data platform (server)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",  # Depends(scope=…): commit before the response is sent
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "fitdecode>=0.10",
    "httpx>=0.27",
    "pypdfium2>=5.13.0",
    "pillow>=12.3.0",
    "cryptography>=43",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalocal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a PostgreSQL database (VITALOCAL_TEST_DATABASE_URL)",
    "realdata: needs the real export at data/Gadgetbridge.zip",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# prompt prose reads better unwrapped
"src/vitalocal/ai.py" = ["E501"]
# SQL in migrations that already ran stays as it was
"alembic/versions/*" = ["E501"]
